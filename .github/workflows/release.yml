name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"

      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          print(f"release {tag}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke-test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/aed-wheel"
          "$RUNNER_TEMP/aed-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/aed-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/aed-wheel/bin/aed" --version
          "$RUNNER_TEMP/aed-wheel/bin/aed" doctor

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aedificatoria/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
