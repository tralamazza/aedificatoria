name: aed

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Tests
        run: python -m pytest -q

      - name: Resolve base
        id: base
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${PR_BASE:-$EVENT_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          head=$(git rev-parse HEAD)
          if [ "$base" = "$head" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || echo "$head")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Guard
        env:
          AED_BASE: ${{ steps.base.outputs.base }}
        run: aed check --base "$AED_BASE"
