name: aed

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Tests
        run: python -m pytest -q

      - name: Usefulness mutation benchmark
        run: python benchmarks/usefulness/run.py --gate --output /tmp/usefulness.json

      - name: Guard
        uses: ./
        with:
          version: source
