[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "aedificatoria"
version = "0.1.7"
description = "Architecture guard for coding agents: make design constraints executable."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daniel Tralamazza" }]
requires-python = ">=3.11"
keywords = ["architecture", "coding-agents", "guard", "static-analysis", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter==0.27.0",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-typescript==0.23.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aed = "aedificatoria.cli:main"

[project.urls]
Homepage = "https://github.com/tralamazza/aedificatoria"
Repository = "https://github.com/tralamazza/aedificatoria"
Issues = "https://github.com/tralamazza/aedificatoria/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aedificatoria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
