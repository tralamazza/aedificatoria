# Aedificatoria configuration.

[aed]
base = "HEAD"
adr_dir = "docs/decisions"
source_roots = ["src", "."]

# Paths whose change requires an architecture decision record.
# one_way_doors = [
#   "migrations/**", "**/migrations/**",
#   "schema/**", "**/schema/**",
#   "api/**", "**/api/**",
#   "auth/**", "**/auth/**",
#   "*.proto", "**/*.proto",
#   "**/openapi*.yaml", "**/openapi*.json",
# ]

# test_paths = [
#   "tests/**", "**/tests/**", "**/test_*.py", "**/*_test.py",
#   "**/*_test.rs", "**/*_tests.rs", "**/*.test.*", "**/*.spec.*",
# ]
# api_paths = ["**/*.py", "**/*.rs", "**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.mjs", "**/*.cjs", "**/*.mts", "**/*.cts"]
allow_new_dependencies = ["tree_sitter", "tree_sitter_javascript", "tree_sitter_rust", "tree_sitter_typescript"]
cargo_advisory = true
require_adr_for_large_change = true
block_removed_tests = true
block_removed_asserts = true
block_new_skips = true
block_breaking_api = true

[thresholds]
max_changed_files = 25
max_changed_lines = 800
max_complexity = 15
complexity_delta = 5

# [[aed.forbidden_edges]]
# from = "api"
# to = "db"
# reason = "API must go through the service layer, not the database directly."
